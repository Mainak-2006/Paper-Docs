name: Instrumentation

# The emulator-backed suite is slow, so it is kept off the pull request path and runs on main plus a
# nightly schedule. Pull requests are gated by .github/workflows/verify.yml.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-tests:
    name: Connected Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Without this the emulator runs without hardware virtualisation and falls back to software,
      # which is roughly an order of magnitude slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35 with the same AVD shape used locally, so a failure here is a real regression rather
      # than an environment difference. The profile is an avdmanager device id and is lowercase with
      # underscores -- `Pixel_6` is rejected by avdmanager, `pixel_6` is accepted. Run
      # `avdmanager list device` if a future runner image renames these.
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # -no-boot-anim matters: without it the emulator still plays the boot animation, which
          # adds minutes before the device is ready to accept the test APK.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-report-${{ github.run_id }}
          path: app/build/reports/androidTests/
          retention-days: 14