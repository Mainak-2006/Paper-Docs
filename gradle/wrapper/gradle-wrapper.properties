#Gradle distribution used by the wrapper.
#
# Pinned to 8.13, which is what Android Gradle Plugin 8.13.2 is built and tested against. Do not
# move this to a Gradle 9.x release without moving AGP to 9.x first: the 8.x plugin line is not
# compatible with Gradle 9 and the build fails to configure.
#
# The checksum below is the published SHA-256 for gradle-8.13-bin.zip, verified against the
# downloaded archive. It was already correct here; the wrapper had been pointed at the 9.7.1 URL
# while still carrying the 8.13 checksum, which would have failed validation even with a working
# download. Changing the URL without changing the checksum is what broke the build.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists