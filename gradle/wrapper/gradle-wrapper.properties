#Gradle distribution used by the wrapper.
#
# Pinned to 8.13, which is what Android Gradle Plugin 8.13.2 is built and tested against. Do not
# move this to a Gradle 9.x release without moving AGP to 9.x first: the 8.x plugin line is not
# compatible with Gradle 9 and the build fails to configure.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# TODO restore before the next build that has network access. Copy the `SHA-256` for
# gradle-8.13-bin.zip from https://services.gradle.org/distributions/ and uncomment. The line was
# dropped when the wrapper was reverted from 9.7.1 to 8.13 offline, because the checksum on file
# belonged to the 9.7.1 archive and a mismatched value fails the build outright. With no network the
# cached 8.13 distribution is already extracted, so the wrapper resolves it without downloading and
# does not need the checksum to run.
# distributionSha256Sum=